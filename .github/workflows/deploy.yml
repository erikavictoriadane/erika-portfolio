name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    # Automatically rebuild twice daily (00:00 and 12:00 UTC) to fetch new Medium RSS articles
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & compile Astro SSG
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID || vars.PUBLIC_GA_ID }}
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID || vars.PUBLIC_GTM_ID }}
        run: |
          npm run check
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy static assets
        id: deployment
        uses: actions/deploy-pages@v4
